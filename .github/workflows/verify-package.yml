name: Verify packed package

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.14.0"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify the exact package candidate
        run: npm run verify:package -- --output "$RUNNER_TEMP/neon-usage-package"
      - name: Retain the verified tarball and checksum manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neon-usage-verified-package
          path: ${{ runner.temp }}/neon-usage-package/*
          if-no-files-found: error
          retention-days: 14
